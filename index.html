<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Black Hole</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.6);
            z-index: 2;
            pointer-events: none;
            letter-spacing: 2px;
            font-size: 14px;
            text-transform: uppercase;
        }
        .title {
            font-size: 24px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 5px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="title">Sagittarius A*</div>
        <div>Supermassive Black Hole</div>
        <div>Observation Data Active</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Set up the scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0)); // Cap pixel ratio for performance
        document.body.appendChild(renderer.domElement);

        // Uniforms for the shader
        const uniforms = {
            iTime: { value: 0 },
            iResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float iTime;
            uniform vec2 iResolution;
            varying vec2 vUv;

            #define NUM_STEPS 60
            #define NUM_VOL_STEPS 25
            #define MAX_DIST 15.0

            // Utility functions
            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            float hash(float n) {
                return fract(sin(n) * 43758.5453123);
            }

            float hash21(vec2 p) {
                return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
            }

            // 3D Noise for volume
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                float n = p.x + p.y * 57.0 + 113.0 * p.z;
                return mix(
                    mix(mix(hash(n + 0.0), hash(n + 1.0), f.x),
                        mix(hash(n + 57.0), hash(n + 58.0), f.x), f.y),
                    mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                        mix(hash(n + 170.0), hash(n + 171.0), f.x), f.y), f.z);
            }

            float fbm(vec3 p) {
                float f = 0.0;
                float w = 0.5;
                for (int i = 0; i < 4; i++) {
                    f += w * noise(p);
                    p *= 2.01;
                    w *= 0.5;
                }
                return f;
            }

            void mainImage(out vec4 fragColor, in vec2 fragCoord) {
                vec2 uv = (fragCoord - 0.5 * iResolution.xy) / min(iResolution.y, iResolution.x);

                // Camera setup
                vec3 ro = vec3(0.0, 1.0, -5.5);
                ro.yz *= rot(0.2); // slight tilt
                ro.xz *= rot(iTime * 0.05); // orbit slowly

                vec3 ta = vec3(0.0, 0.0, 0.0);
                vec3 cw = normalize(ta - ro);
                vec3 cu = normalize(cross(cw, vec3(0.0, 1.0, 0.0)));
                vec3 cv = normalize(cross(cu, cw));
                vec3 rd = normalize(uv.x * cu + uv.y * cv + 1.2 * cw);

                // Black hole params
                float mass = 1.0;
                float rs = 1.0; // Schwarzschild radius

                vec3 p = ro;
                vec3 dir = rd;
                float dt = 0.1;

                vec3 col = vec3(0.0);
                float hitAccretionDisk = 0.0;
                vec3 diskColor = vec3(0.0);
                float transmit = 1.0;

                // Background starfield setup
                vec3 bgDir = rd; // Default if no bend

                // Light ray marching (Non-linear due to gravity)
                for(int i = 0; i < NUM_STEPS; i++) {
                    float r = length(p);

                    if (r < rs * 0.95) {
                        // Event horizon reached
                        transmit = 0.0;
                        break;
                    }
                    if (r > MAX_DIST) {
                        bgDir = dir; // Final direction for background
                        break;
                    }

                    // Gravitational bending (approximated)
                    // Acceleration towards center: -p * mass / r^3
                    vec3 accel = -p * (mass / pow(r, 3.0));
                    dir = normalize(dir + accel * dt * 1.5);

                    // Volumetric Accretion Disk
                    // A flat disk along the XZ plane
                    float distToPlane = abs(p.y);
                    if (distToPlane < 0.25 && r > rs * 1.5 && r < rs * 6.0) {
                        float diskDensity = 0.0;

                        // Transform to polar for rotation
                        float angle = atan(p.z, p.x);
                        // Differential rotation (faster near center)
                        angle -= iTime * 0.8 * pow(rs/r, 1.5);

                        vec3 samplePos = vec3(r * 2.0, angle * 3.0, p.y * 10.0);

                        // Noise density
                        float n = fbm(samplePos - vec3(iTime * 0.2, 0.0, 0.0));
                        n = smoothstep(0.3, 1.0, n);

                        // Shaping the disk
                        float radialFade = smoothstep(rs * 6.0, rs * 4.0, r) * smoothstep(rs * 1.2, rs * 2.0, r);
                        float heightFade = smoothstep(0.25, 0.0, distToPlane);

                        diskDensity = n * radialFade * heightFade * 1.5;

                        if (diskDensity > 0.01) {
                            // Color palette from fiery orange to bright blue near horizon
                            vec3 c = mix(vec3(0.9, 0.3, 0.05), vec3(1.0, 0.8, 0.4), smoothstep(rs * 5.0, rs * 2.5, r));
                            // Extreme heat/blue shift near event horizon
                            c = mix(c, vec3(0.3, 0.7, 1.0), smoothstep(rs * 2.5, rs * 1.2, r));

                            // Emissive + absorption
                            float alpha = clamp(diskDensity * 0.15, 0.0, 1.0);
                            diskColor += transmit * c * diskDensity * 0.5;
                            transmit *= (1.0 - alpha);
                        }
                    }

                    // Variable step size: smaller steps near black hole
                    dt = min(0.15, r * 0.05 + 0.01);
                    p += dir * dt;

                    if (transmit < 0.01) break;
                }

                // Add background if light escaped
                if (transmit > 0.01) {
                    // Milky Way / Nebulous background
                    float neb = fbm(bgDir * 3.0);
                    vec3 nebColor = mix(vec3(0.05, 0.02, 0.1), vec3(0.1, 0.15, 0.25), neb);

                    // Stars
                    float starSeed = hash21(bgDir.xy * 200.0 + bgDir.z * 100.0);
                    float star = pow(starSeed, 100.0) * 2.5;
                    nebColor += vec3(star);

                    col += transmit * nebColor;
                }

                col += diskColor;

                // Photon sphere glow (Einstein ring)
                float d = length(uv);
                float ring = smoothstep(0.4, 0.2, abs(d - 0.25));
                col += vec3(1.0, 0.6, 0.2) * ring * 0.1 * transmit;

                // Post-processing (Tone mapping and Gamma)
                col = 1.0 - exp(-col * 1.4);
                col = pow(col, vec3(1.0 / 2.2));

                // Subtle vignette
                float vignette = smoothstep(1.5, 0.5, length(uv));
                col *= vignette;

                fragColor = vec4(col, 1.0);
            }

            void main() {
                mainImage(gl_FragColor, gl_FragCoord.xy);
            }
        `;

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            depthWrite: false,
            depthTest: false
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        let lastTime = 0;
        // Animation Loop
        function animate(time) {
            requestAnimationFrame(animate);
            // Limit delta time to prevent huge jumps if tab is inactive
            const dt = time - lastTime;
            lastTime = time;

            uniforms.iTime.value += Math.min(dt * 0.001, 0.05);
            renderer.render(scene, camera);
        }

        requestAnimationFrame(animate);

        // Handle Resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            uniforms.iResolution.value.set(width, height);
        });
    </script>
</body>
</html>
